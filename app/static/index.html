<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Basel Trader"><link rel="manifest" href="/static/manifest.json"><title>Basel Trader</title><style>*{box-sizing:border-box}:root{font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#0a0d12;color:#eef2f7}body{margin:0;background:#0a0d12;min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 94px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:#8d98a8;font-size:13px}.pill{font-size:12px;padding:7px 10px;border:1px solid #2b3440;border-radius:999px;background:#121720}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.card{background:#121720;border:1px solid #242c38;border-radius:16px;padding:14px;min-height:92px}.label{font-size:12px;color:#8792a2}.value{font-size:22px;font-weight:800;margin-top:8px}.small{font-size:12px;color:#8792a2;margin-top:5px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section h2{font-size:16px;margin:0}.sub{font-size:12px;color:#8792a2;margin-top:3px}.list{display:flex;flex-direction:column;gap:8px}.row{background:#121720;border:1px solid #242c38;border-radius:15px;padding:13px}.rowtop{display:flex;justify-content:space-between;align-items:center}.sym{font-size:18px;font-weight:850}.score{font-weight:850;font-size:18px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.meta div{font-size:11px;color:#8792a2}.meta b{display:block;color:#eef2f7;font-size:13px;margin-top:3px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.levels div{background:#0f141b;border:1px solid #202936;border-radius:10px;padding:9px;font-size:10px;color:#8792a2}.levels b{display:block;color:#eef2f7;font-size:13px;margin-top:3px}.reason{font-size:11px;color:#aab4c0;margin-top:9px;line-height:1.45}.good{color:#83e6a4}.warn{color:#ffd36a}.bad{color:#ff7777}.blue{color:#7db3ff}.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(10,13,18,.94);backdrop-filter:blur(14px);border-top:1px solid #242c38}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800}.scan{background:#eef2f7;color:#0a0d12}.kill{background:#ff6262;color:#151515}.empty{padding:24px;text-align:center;color:#8792a2;background:#121720;border:1px solid #242c38;border-radius:15px}.regime{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><div class="top"><div class="brand"><h1>BASEL TRADER PRO</h1><p>Smart US Momentum • Paper Only</p></div><div class="pill" id="mode">Loading…</div></div><div class="cards"><div class="card"><div class="label">Market</div><div class="value" id="market">—</div><div class="small" id="regimeText">Regime —</div></div><div class="card"><div class="label">Equity</div><div class="value" id="equity">—</div><div class="small" id="buyingPower">Buying power —</div></div><div class="card"><div class="label">Daily Drawdown</div><div class="value" id="drawdown">—</div><div class="small" id="riskGuard">Risk guard —</div></div><div class="card"><div class="label">Auto Bot</div><div class="value" id="autoBot">OFF</div><div class="small" id="armed">Armed —</div></div></div><div class="section"><div class="section-head"><div><h2>Top Smart Setups</h2><div class="sub">Pullback → Reclaim → Volume → 2-stage confirmation</div></div><div class="pill" id="count">0 stocks</div></div><div id="list" class="list"><div class="empty">Tap SCAN MARKET to start.</div></div></div></div><div class="nav"><div class="navin"><button class="kill" onclick="kill()">KILL SWITCH</button><button class="scan" onclick="scan()">SCAN MARKET</button></div></div><script>const $=id=>document.getElementById(id);const money=x=>x==null?'—':'$'+Number(x).toLocaleString(undefined,{maximumFractionDigits:2});function esc(a){return Array.isArray(a)?a.join(' • '):''}async function status(){try{const [rs,rr]=await Promise.all([fetch('/api/status'),fetch('/api/risk-status')]);const s=await rs.json();const risk=rr.ok?await rr.json():{};$('mode').textContent=s.mode;$('market').textContent=s.market_open?'OPEN':'CLOSED';$('equity').textContent=money(s.equity);$('buyingPower').textContent='Buying power '+money(s.buying_power);$('autoBot').textContent=s.engine?.auto_enabled?'ON':'OFF';$('autoBot').className='value '+(s.engine?.auto_enabled?'good':'');$('armed').textContent='Armed '+((s.engine?.armed_symbols||[]).join(', ')||'—');const dd=Number(risk.drawdown_pct||0);$('drawdown').textContent=(dd>=0?'-':'')+Math.abs(dd).toFixed(2)+'%';$('drawdown').className='value '+(risk.blocked?'bad':'');$('riskGuard').textContent=risk.blocked?'DAILY LOSS GUARD ON':'Risk guard OK'}catch(e){$('mode').textContent='OFFLINE'}}async function scan(){$('list').innerHTML='<div class="empty">Scanning live market…</div>';const r=await fetch('/api/scan');const d=await r.json();if(!r.ok){$('list').innerHTML=`<div class="empty">${d.detail||'Scanner error'}</div>`;return}const c=d.candidates||[];$('count').textContent=c.length+' stocks';const regime=c[0]?.market_regime;if(regime){$('regimeText').textContent='SPY/QQQ '+(regime.longs_allowed?'SUPPORTIVE':'BLOCKING');$('regimeText').className='small '+(regime.longs_allowed?'good':'bad')}$('list').innerHTML=c.map(x=>{const armed=(x.symbol&&window._armed||[]).includes?.(x.symbol);const state=x.eligible?'READY':'WAIT';const cls=x.eligible?'good':'warn';const reasons=x.eligible?esc(x.reasons):esc(x.reject_reasons);return `<div class="row"><div class="rowtop"><div><span class="sym">${x.symbol}</span> <span class="${cls}">${state}</span></div><div class="score">${x.score}</div></div><div class="meta"><div>PRICE<b>${money(x.price)}</b></div><div>MOVE<b>${Number(x.change_pct).toFixed(1)}%</b></div><div>RVOL<b>${Number(x.rvol||0).toFixed(2)}x</b></div><div>SPREAD<b>${Number(x.spread_pct).toFixed(2)}%</b></div></div><div class="meta"><div>VWAP<b>${money(x.vwap)}</b></div><div>EMA9<b>${money(x.ema9)}</b></div><div>EMA20<b>${money(x.ema20)}</b></div><div>RISK<b>${Number(x.risk_pct||0).toFixed(2)}%</b></div></div><div class="levels"><div>ENTRY<b>${money(x.entry)}</b></div><div>STOP<b>${money(x.stop)}</b></div><div>TARGET<b>${money(x.target)}</b></div></div><div class="reason">${reasons||'No explanation available'}</div></div>`}).join('')}async function kill(){await fetch('/api/kill-switch?enabled=true',{method:'POST'});await status()}if('serviceWorker'in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{})}status();setInterval(status,20000);</script></body></html>
