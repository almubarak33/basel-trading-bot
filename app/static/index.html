<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Basel Trader"><link rel="manifest" href="/static/manifest.json"><title>Basel Trader</title><style>*{box-sizing:border-box}:root{font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#0a0d12;color:#eef2f7}body{margin:0;background:#0a0d12;min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 94px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:#8d98a8;font-size:13px}.pill{font-size:12px;padding:7px 10px;border:1px solid #2b3440;border-radius:999px;background:#121720}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.card{background:#121720;border:1px solid #242c38;border-radius:16px;padding:14px;min-height:92px}.label{font-size:12px;color:#8792a2}.value{font-size:22px;font-weight:800;margin-top:8px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section h2{font-size:16px;margin:0}.sub{font-size:12px;color:#8792a2;margin-top:3px}.list{display:flex;flex-direction:column;gap:8px}.row{background:#121720;border:1px solid #242c38;border-radius:15px;padding:13px}.rowtop{display:flex;justify-content:space-between;align-items:center}.sym{font-size:18px;font-weight:850}.score{font-weight:850;font-size:18px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.meta div{font-size:11px;color:#8792a2}.meta b{display:block;color:#eef2f7;font-size:13px;margin-top:3px}.good{color:#83e6a4}.warn{color:#ffd36a}.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(10,13,18,.94);backdrop-filter:blur(14px);border-top:1px solid #242c38}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800}.scan{background:#eef2f7;color:#0a0d12}.kill{background:#ff6262;color:#151515}.empty{padding:24px;text-align:center;color:#8792a2;background:#121720;border:1px solid #242c38;border-radius:15px}@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><div class="top"><div class="brand"><h1>BASEL TRADER</h1><p>US Momentum • Mobile Paper Bot</p></div><div class="pill" id="mode">Loading…</div></div><div class="cards"><div class="card"><div class="label">Market</div><div class="value" id="market">—</div></div><div class="card"><div class="label">Equity</div><div class="value" id="equity">—</div></div><div class="card"><div class="label">Orders</div><div class="value" id="orders">—</div></div><div class="card"><div class="label">Kill Switch</div><div class="value" id="killState">—</div></div></div><div class="section"><div class="section-head"><div><h2>Top Momentum</h2><div class="sub">Experimental scoring — paper only</div></div><div class="pill" id="count">0 stocks</div></div><div id="list" class="list"><div class="empty">Tap SCAN MARKET to start.</div></div></div></div><div class="nav"><div class="navin"><button class="kill" onclick="kill()">KILL SWITCH</button><button class="scan" onclick="scan()">SCAN MARKET</button></div></div><script>const $=id=>document.getElementById(id);const money=x=>x==null?'—':'$'+Number(x).toLocaleString(undefined,{maximumFractionDigits:2});async function status(){try{const r=await fetch('/api/status');const s=await r.json();$('mode').textContent=s.mode;$('market').textContent=s.market_open?'OPEN':'CLOSED';$('equity').textContent=money(s.equity);$('orders').textContent=s.orders_enabled?'ON':'SAFE';$('killState').textContent=s.kill_switch?'ON':'OFF'}catch(e){$('mode').textContent='OFFLINE'}}async function scan(){$('list').innerHTML='<div class="empty">Scanning market…</div>';const r=await fetch('/api/scan');const d=await r.json();if(!r.ok){$('list').innerHTML=`<div class="empty">${d.detail||'Scanner error'}</div>`;return}$('count').textContent=d.candidates.length+' stocks';$('list').innerHTML=d.candidates.map(x=>`<div class="row"><div class="rowtop"><div><span class="sym">${x.symbol}</span> <span class="${x.eligible?'good':'warn'}">${x.eligible?'READY':'WATCH'}</span></div><div class="score">${x.score}</div></div><div class="meta"><div>PRICE<b>${money(x.price)}</b></div><div>MOVE<b>+${Number(x.change_pct).toFixed(1)}%</b></div><div>VOL RANK<b>#${x.volume_rank}</b></div><div>SPREAD<b>${Number(x.spread_pct).toFixed(2)}%</b></div></div></div>`).join('')}async function kill(){await fetch('/api/kill-switch?enabled=true',{method:'POST'});await status()}if('serviceWorker'in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{})}status();setInterval(status,30000);</script></body></html>
