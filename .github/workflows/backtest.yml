name: Backtest

# Runs the strategy replay on GitHub's machines so it can be launched from a
# phone: open Actions -> Backtest -> Run workflow. The report is written to the
# run summary, which is readable on mobile without downloading anything.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2023-12-01"
      end:
        description: "End date (YYYY-MM-DD) — must be before today"
        required: true
        default: "2024-05-31"
      limit:
        description: "Universe size (most liquid N). Larger = slower and more memory."
        required: true
        default: "150"
      preset:
        description: "Which experiment to run"
        type: choice
        required: true
        default: baseline
        options:
          - baseline
          - no-regime-exit
          - regime-entry-block
      overrides:
        description: "Extra overrides, e.g. --set min_score=80 (advanced)"
        required: false
        default: ""
      survivors_only:
        description: "Exclude delisted names (introduces survivorship bias)"
        type: boolean
        default: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Check credentials are configured
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "::error::ALPACA_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Credentials present."

      - name: Build universe
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          python -m app.backtest.build_universe \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.survivors_only && '--survivors-only' || '' }} \
            --out universe.txt
          echo "UNIVERSE_SIZE=$(wc -l < universe.txt)" >> "$GITHUB_ENV"

      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          mkdir -p results
          # Assemble overrides from the toggles so an A/B test never depends on
          # typing a command string correctly into a phone keyboard.
          OVERRIDES="${{ inputs.overrides }}"
          case "${{ inputs.preset }}" in
            baseline)       ;;
            no-regime-exit) OVERRIDES="$OVERRIDES --set regime_exit_enabled=false" ;;
            # Restores the pre-AGGRESSIVE behaviour of refusing to enter at all
            # while the broad market is risk-off, instead of only tagging it.
            regime-entry-block) OVERRIDES="$OVERRIDES --set trading_profile=STANDARD" ;;
            *) echo "::error::Unknown preset '${{ inputs.preset }}'"; exit 1 ;;
          esac
          OVERRIDES="$(echo "$OVERRIDES" | xargs || true)"
          echo "EFFECTIVE_OVERRIDES=${OVERRIDES:-(none)}" >> "$GITHUB_ENV"
          echo "Preset: ${{ inputs.preset }}"
          echo "Running with overrides: ${OVERRIDES:-(none)}"
          python -m app.backtest.cli \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --symbols-file universe.txt \
            --json results/summary.json \
            $OVERRIDES \
            2>&1 | tee results/report.txt

      - name: Publish report to the run summary
        if: always()
        run: |
          {
            echo "## Backtest — ${{ inputs.preset }}"
            echo ""
            echo "${{ inputs.start }} → ${{ inputs.end }}"
            echo ""
            echo "Universe: ${UNIVERSE_SIZE:-?} symbols"
            # Always state the configuration: a run whose override was silently
            # dropped is indistinguishable from the baseline without this.
            echo ""
            echo "Overrides: \`${EFFECTIVE_OVERRIDES:-(none)}\`"
            if [ "${{ inputs.survivors_only }}" = "true" ]; then
              echo ""
              echo "> **Survivorship bias:** delisted names were excluded, so these"
              echo "> numbers are better than reality."
            fi
            echo ""
            echo '```'
            # The progress lines are noise on a phone; keep the report itself.
            grep -v '^  …' results/report.txt 2>/dev/null || echo "No report produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.start }}-to-${{ inputs.end }}
          path: |
            results/
            universe.txt
          retention-days: 30
